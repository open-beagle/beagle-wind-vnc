[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
logfile=/tmp/supervisord.log
logfile_maxbytes=5MB
logfile_backups=0
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
nodaemon=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:dbus-session]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; mkdir -pm700 \"${XDG_RUNTIME_DIR}\"; rm -f \"${XDG_RUNTIME_DIR}/bus\"; dbus-daemon --session --nofork --nopidfile --address=\"${DBUS_SESSION_BUS_ADDRESS}\""
stdout_logfile=/tmp/dbus-session.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=1

[program:dbus-system]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; sudo mkdir -pm755 /run/dbus; sudo rm -f /run/dbus/system_bus_socket \"${XDG_RUNTIME_DIR}/dbus-system-bus\"; sudo dbus-daemon --system --nofork --nopidfile --nosyslog --address=\"${DBUS_SYSTEM_BUS_ADDRESS}\""
stdout_logfile=/tmp/dbus-system.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=1

[program:pipewire]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; until [ -S \"${XDG_RUNTIME_DIR}/bus\" ]; do sleep 0.5; done; exec /usr/bin/pipewire"
stdout_logfile=/tmp/pipewire.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=10

[program:wireplumber]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; until [ -S \"${XDG_RUNTIME_DIR}/pipewire-0\" ]; do sleep 0.5; done; exec /usr/bin/wireplumber"
stdout_logfile=/tmp/wireplumber.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=11

[program:pipewire-pulse]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; until [ -S \"${XDG_RUNTIME_DIR}/pipewire-0\" ]; do sleep 0.5; done; exec /usr/bin/pipewire-pulse"
stdout_logfile=/tmp/pipewire-pulse.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=12

[program:kwin-wayland]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; until [ -S \"${XDG_RUNTIME_DIR}/bus\" ]; do sleep 0.5; done; exec /etc/beagle-wind-vnc/start-kwin-wayland.sh"
stdout_logfile=/tmp/kwin-wayland.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=20

[program:xdg-desktop-portal]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; exec /etc/beagle-wind-vnc/start-portals.sh"
stdout_logfile=/tmp/xdg-desktop-portal.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=30

[program:portal-virtual-probe]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; if [ \"${BDWIND_PORTAL_VIRTUAL_PROBE}\" != \"true\" ]; then echo '[kde6] portal probe disabled'; exit 0; fi; until [ -S \"${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}\" ]; do sleep 1; done; until busctl --user --list 2>/dev/null | grep -q org.freedesktop.portal.Desktop; do sleep 1; done; exec /etc/beagle-wind-vnc/portal-virtual-monitor.py"
stdout_logfile=/tmp/portal-virtual-probe.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=unexpected
priority=40

[program:plasmashell]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; exec /etc/beagle-wind-vnc/start-plasmashell.sh"
stdout_logfile=/tmp/plasmashell.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=45

[program:start-webrtc]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; exec /etc/beagle-wind-vnc/start-webrtc.sh"
stdout_logfile=/tmp/start-webrtc.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=50
