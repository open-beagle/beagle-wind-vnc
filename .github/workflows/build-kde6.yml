name: Build KDE6 Image

on:
  push:
    branches:
      - kde6

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v2
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Build and push Docker image - kde6
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./.beagle/kde6.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:1.2.0
            ghcr.io/${{ github.repository }}:latest-kde6
            registry.cn-qingdao.aliyuncs.com/wod/beagle-wind-vnc:1.2.0
            registry.cn-qingdao.aliyuncs.com/wod/beagle-wind-vnc:latest-kde6
          platforms: linux/amd64
          build-args: |
            BASE=ubuntu:26.04
            GSTREAMER_VERSION=1.28.5
            GSTREAMER_TARBALL_URL=https://cache.ali.wodcloud.com/vscode/bdwind/bdwind-gstreamer-1.28.5-ubuntu2604-eaabbfd.tar.gz
            WEBRTC_TARBALL_URL=https://cache.ali.wodcloud.com/vscode/bdwind/bdwind-webrtc-1.28.2-5fa72ba.tar.gz
          no-cache: true

      - name: Image push success
        run: echo "Docker image pushed successfully to registry.cn-qingdao.aliyuncs.com/wod/beagle-wind-vnc:1.2.0"
