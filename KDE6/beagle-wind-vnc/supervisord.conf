[program:kactivitymanagerd]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; until [ -S \"${XDG_RUNTIME_DIR}/bus\" ] && [ -S \"${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}\" ]; do sleep 0.2; done; exec /usr/lib/x86_64-linux-gnu/libexec/kactivitymanagerd"
stdout_logfile=/tmp/kactivitymanagerd.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
