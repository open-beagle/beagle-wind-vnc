[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
logfile=/tmp/supervisord.log
logfile_maxbytes=5MB
logfile_backups=0
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
nodaemon=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:dbus-session]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; mkdir -pm700 \"${XDG_RUNTIME_DIR}\"; rm -f \"${XDG_RUNTIME_DIR}/bus\"; dbus-daemon --session --nofork --nopidfile --address=\"${DBUS_SESSION_BUS_ADDRESS}\""
stdout_logfile=/tmp/dbus-session.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=1

[program:dbus-system]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; sudo mkdir -pm755 /run/dbus; sudo rm -f /run/dbus/system_bus_socket \"${XDG_RUNTIME_DIR}/dbus-system-bus\"; sudo dbus-daemon --system --nofork --nopidfile --nosyslog --address=\"${DBUS_SYSTEM_BUS_ADDRESS}\""
stdout_logfile=/tmp/dbus-system.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=1

[program:pipewire]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; until [ -S \"${XDG_RUNTIME_DIR}/bus\" ]; do sleep 0.5; done; exec /usr/bin/pipewire"
stdout_logfile=/tmp/pipewire.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=10

[program:wireplumber]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; until [ -S \"${XDG_RUNTIME_DIR}/pipewire-0\" ]; do sleep 0.5; done; exec /usr/bin/wireplumber"
stdout_logfile=/tmp/wireplumber.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=11

[program:smithay-display]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; exec /etc/beagle-wind-vnc/start-smithay-display.sh"
stdout_logfile=/tmp/smithay-display.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=15

[program:pipewire-pulse]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; until [ -S \"${XDG_RUNTIME_DIR}/pipewire-0\" ]; do sleep 0.5; done; exec /usr/bin/pipewire-pulse"
stdout_logfile=/tmp/pipewire-pulse.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
